name: 1A2X Auto Daily Check-in

on:
  schedule:
    - cron: '45 22 * * *'  # 早班：北京时间 06:45 进队列（与前两个任务错开 15 分钟）
  workflow_dispatch: # 允许手动点击触发

jobs:
  Daily-Checkin-1A2X:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - uses: actions/checkout@v4

    - name: ⚙ 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 🛠️ 安装环境与浏览器依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 挂载代理 (如配置了节点)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 执行 1A2X 每日签到
      env:
        USERS_JSON: ${{ secrets.FORUM_1A2X_USERS }}
        FORUM_1A2X_EMAIL: ${{ secrets.FORUM_1A2X_EMAIL }}
        FORUM_1A2X_PASSWORD: ${{ secrets.FORUM_1A2X_PASSWORD }}
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 1a2x_app.py

    - name: 🕒 保活与更新运行时间
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> time.txt
        git add time.txt
        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m "⏱️ 1A2X Checkin Keep-Alive $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
        fi
