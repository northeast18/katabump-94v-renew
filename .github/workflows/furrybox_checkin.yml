name: FurryBox Auto Daily Check-in

on:
  schedule:
    - cron: '0 23 * * *'  # 早班：北京时间 07:00 进队列（与 9v4、1A2X 错开 15 分钟）
  workflow_dispatch: # 允许手动点击触发

jobs:
  Daily-Checkin-FurryBox:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - uses: actions/checkout@v4

    - name: ⚙ 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 🛠️ 安装依赖
      run: |
        pip install requests

    - name: ⚙ 挂载代理 (如配置了节点)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 执行 FurryBox 每日签到
      env:
        USERS_JSON: ${{ secrets.FURRYBOX_USERS }}
        FURRYBOX_EMAIL: ${{ secrets.FURRYBOX_EMAIL }}
        FURRYBOX_PASSWORD: ${{ secrets.FURRYBOX_PASSWORD }}
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        python3 furrybox_app.py

    - name: 🕒 保活与更新运行时间
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> time.txt
        git add time.txt
        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m "⏱️ FurryBox Checkin Keep-Alive $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
        fi
